name: Build iOS demo (Theos)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ runner.temp }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: brew install ldid xz

      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/install-toolchain"
          "$THEOS/bin/install-sdk" latest

      - name: Build demo package
        run: |
          make -C demo package FINALPACKAGE=1 THEOS="$THEOS" TARGET=iphone:clang:latest:16.0 V=1

      - name: Validate generated package
        run: |
          test -n "$(find demo/packages -maxdepth 1 -name '*.deb' -print -quit)"
          find demo/packages -maxdepth 1 -type f -print
          file demo/packages/*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: api-fluck-demo-deb
          path: demo/packages/*.deb
          if-no-files-found: error
          retention-days: 14
